name: Post to Instagram

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC = 7:30 PM IST (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      day:
        description: 'Sheet day number to post NOW, without Telegram approval (leave empty = today, needs approval)'
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$DAY" ]; then
            python post_from_github.py --day "$DAY" --publish
          else
            python post_from_github.py --today --publish --require-approval
          fi
